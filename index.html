<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Крути, Дима!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one fixed full-screen stage; low-res canvas scaled up, DOM overlays sized in canvas pixels via --s */
:root{
  --bg:#0b0d16; --ink:#fff4d6; --ink-dim:#c9bfa6; --panel:#18203a; --panel-2:#222c4d;
  --edge:#ffcf4a; --red:#e5372f; --red-dk:#9e1f1a; --teal:#5fd4c4; --dima:#ffd76a; --jenya:#ff8a78;
  --px:'Press Start 2P', 'Courier New', monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  box-sizing:border-box;background:var(--bg);touch-action:none;}
#stage{position:relative;touch-action:none;--s:4;font-family:var(--px);}
#c{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*6px);text-align:center;padding:calc(var(--s)*6px);box-sizing:border-box;}
.panel{background:var(--panel);border:calc(var(--s)*2px) solid var(--edge);box-shadow:0 0 0 calc(var(--s)*1px) var(--bg),calc(var(--s)*3px) calc(var(--s)*3px) 0 calc(var(--s)*1px) rgba(0,0,0,.55);
  padding:calc(var(--s)*8px) calc(var(--s)*10px);display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*5px);max-width:min(92%,calc(var(--s)*230px));box-sizing:border-box;max-height:94%;overflow:auto;}
.fs-s{font-size:clamp(8px,calc(var(--s)*6px),15px);line-height:1.6;}
.btn{font-family:var(--px);font-size:clamp(9px,calc(var(--s)*7px),17px);color:var(--ink);background:var(--panel-2);border:calc(var(--s)*1.5px) solid var(--ink);
  padding:calc(var(--s)*4px) calc(var(--s)*7px);cursor:pointer;box-shadow:calc(var(--s)*2px) calc(var(--s)*2px) 0 #000;line-height:1.3;}
.btn:hover{background:#2e3a63}
.btn:active{transform:translate(calc(var(--s)*1px),calc(var(--s)*1px));box-shadow:calc(var(--s)*1px) calc(var(--s)*1px) 0 #000;}
.btn:focus-visible{outline:calc(var(--s)*1.5px) dashed var(--edge);outline-offset:calc(var(--s)*1.5px);}
.btn.primary{background:var(--red);border-color:var(--ink);}
.btn.primary:hover{background:#f04a40}
.btn.small{font-size:clamp(7px,calc(var(--s)*5px),13px);padding:calc(var(--s)*3px) calc(var(--s)*4px);}
.btns{display:flex;flex-wrap:wrap;gap:calc(var(--s)*4px);justify-content:center;}

/* Title */
#menu{justify-content:flex-start;padding-top:calc(var(--s)*14px);}
.title{display:flex;flex-direction:column;align-items:center;line-height:1;gap:calc(var(--s)*3px);}
.title span{font-size:clamp(20px,calc(var(--s)*22px),64px);color:var(--ink);
  text-shadow:calc(var(--s)*1.5px) calc(var(--s)*1.5px) 0 var(--red),calc(var(--s)*3px) calc(var(--s)*3px) 0 var(--red-dk),calc(var(--s)*4.5px) calc(var(--s)*4.5px) 0 #000;}
.title .t2{color:var(--edge);font-size:clamp(24px,calc(var(--s)*28px),80px);}
.sub{font-size:clamp(8px,calc(var(--s)*5.5px),14px);color:var(--ink);background:rgba(11,13,22,.72);padding:calc(var(--s)*2.5px) calc(var(--s)*4px);}
.menu-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*4px);}
.best{font-size:clamp(7px,calc(var(--s)*5px),13px);color:var(--edge);background:rgba(11,13,22,.72);padding:calc(var(--s)*2px) calc(var(--s)*3px);}
.hint{font-size:clamp(7px,calc(var(--s)*4.5px),12px);color:var(--ink-dim);background:rgba(11,13,22,.72);padding:calc(var(--s)*2px) calc(var(--s)*3px);line-height:1.6;max-width:92%;}

#fin{justify-content:flex-start;padding-top:calc(var(--s)*12px);}
.fin-title span{font-size:clamp(18px,calc(var(--s)*17px),52px);}
.fin-title .t2{font-size:clamp(22px,calc(var(--s)*24px),70px);}
/* Cards / results */
.eyebrow{font-size:clamp(7px,calc(var(--s)*5px),13px);color:var(--teal);letter-spacing:.08em;}
.big{font-size:clamp(14px,calc(var(--s)*13px),36px);color:var(--edge);text-shadow:calc(var(--s)*1.5px) calc(var(--s)*1.5px) 0 var(--red-dk);line-height:1.2;}
.txt{font-size:clamp(8px,calc(var(--s)*5.5px),14px);line-height:1.7;color:var(--ink);max-width:calc(var(--s)*190px);}
.say{display:flex;align-items:center;gap:calc(var(--s)*4px);text-align:left;max-width:calc(var(--s)*200px);}
.say canvas{width:calc(var(--s)*20px);height:calc(var(--s)*20px);image-rendering:pixelated;flex:none;border:calc(var(--s)*1px) solid var(--ink);background:#7fc3e6;}
.say div{font-size:clamp(8px,calc(var(--s)*5.5px),14px);line-height:1.6;min-width:0;}
.stats{display:grid;grid-template-columns:auto auto;gap:calc(var(--s)*2px) calc(var(--s)*10px);font-size:clamp(8px,calc(var(--s)*5.5px),14px);text-align:left;font-variant-numeric:tabular-nums;}
.stats .v{color:var(--edge);text-align:right;}
.note{font-size:clamp(7px,calc(var(--s)*4.5px),12px);color:var(--ink-dim);line-height:1.7;max-width:calc(var(--s)*190px);}
.note:empty{display:none}
.stlist{display:grid;grid-template-columns:1fr auto;gap:calc(var(--s)*3px) calc(var(--s)*6px);align-items:center;width:100%;}
.stlist .nm{font-size:clamp(8px,calc(var(--s)*6px),15px);text-align:left;line-height:1.4;}
.stlist .nm small{display:block;font-size:clamp(7px,calc(var(--s)*4.5px),11px);color:var(--ink-dim);margin-top:calc(var(--s)*1px);}
.stlist .acts .btn{white-space:nowrap;}
.stlist .acts{display:flex;gap:calc(var(--s)*3px);justify-content:flex-end;}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none;transform:none;}

/* Dialogue */
#dlg{position:absolute;left:3%;right:3%;bottom:4%;display:flex;gap:calc(var(--s)*4px);align-items:flex-start;background:var(--panel);
  border:calc(var(--s)*1.5px) solid var(--ink);box-shadow:calc(var(--s)*2px) calc(var(--s)*2px) 0 #000;padding:calc(var(--s)*4px);box-sizing:border-box;cursor:pointer;}
#por{width:calc(var(--s)*28px);height:calc(var(--s)*28px);max-width:22vw;max-height:22vw;image-rendering:pixelated;flex:none;border:calc(var(--s)*1px) solid var(--ink);background:#7fc3e6;}
.dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:calc(var(--s)*2.5px);}
#dname{font-size:clamp(8px,calc(var(--s)*5.5px),14px);}
#dtext{font-size:clamp(9px,calc(var(--s)*6.5px),18px);line-height:1.65;min-height:3.3em;}
.dnext{position:absolute;right:calc(var(--s)*4px);bottom:calc(var(--s)*2px);font-size:clamp(7px,calc(var(--s)*5px),12px);color:var(--edge);animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:0}}

/* Foreign greeting caption */
#cap{position:absolute;left:50%;top:7%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*2.5px);
  background:var(--ink);color:#1b1d21;border:calc(var(--s)*1.5px) solid #1b1d21;box-shadow:calc(var(--s)*2.5px) calc(var(--s)*2.5px) 0 var(--red);
  padding:calc(var(--s)*4px) calc(var(--s)*8px);max-width:88%;box-sizing:border-box;text-align:center;}
#capMain{font-family:'Noto Sans Sinhala','Iskoola Pota','Nirmala UI','Noto Sans Devanagari','PingFang SC','Microsoft YaHei',system-ui,sans-serif;font-weight:700;
  font-size:clamp(16px,calc(var(--s)*12px),40px);line-height:1.35;}
#cap.bubble{top:auto;transform:translate(-50%,-100%);box-shadow:none;}
#cap.bubble::after{content:'';position:absolute;left:calc(50% - var(--s)*3px);bottom:calc(var(--s)*-4px - 1px);width:calc(var(--s)*6px);height:calc(var(--s)*6px);background:var(--ink);border-right:calc(var(--s)*1.5px) solid #1b1d21;border-bottom:calc(var(--s)*1.5px) solid #1b1d21;transform:rotate(45deg);}
#cap.bubble.pop{animation:popb .35s steps(4) both}
@keyframes popb{from{transform:translate(-50%,-100%) scale(.4)}to{transform:translate(-50%,-100%) scale(1)}}
#capSub{font-size:clamp(7px,calc(var(--s)*5px),13px);color:#6b2a24;line-height:1.5;}
.pop{animation:pop .35s steps(4) both}
@keyframes pop{from{transform:translateX(-50%) scale(.4)}to{transform:translateX(-50%) scale(1)}}

.corner{position:absolute;top:calc(var(--s)*3px);right:calc(var(--s)*3px);}
#bPause{min-width:calc(var(--s)*16px);}
#loading{font-size:12px;color:var(--ink-dim);}
@media (prefers-reduced-motion: reduce){.dnext{animation:none}.pop{animation:none}}
</style>
</head>
<body>


<div id="app">
  <div id="stage">
    <canvas id="c" width="320" height="180"></canvas>

    <div id="menu" class="layer" hidden>
      <div class="title"><span class="t1">КРУТИ,</span><span class="t2">ДИМА!</span></div>
      <div class="menu-bottom">
        <div class="btns">
          <button id="bCont" class="btn primary" hidden>▶ ПРОДОЛЖИТЬ</button>
          <button id="bStory" class="btn primary">▶ СЮЖЕТ</button>
          <button id="bEndless" class="btn">∞ БЕСКОНЕЧНЫЙ</button>
        </div>
        <div class="btns">
          <button id="bStages" class="btn small" hidden>ЭТАПЫ</button>
          <button id="bSound" class="btn small">ЗВУК: ВКЛ</button>
        </div>
        <div id="best" class="best" hidden></div>
        <div class="hint">← → или A/D. На телефоне держи палец слева или справа</div>
      </div>
    </div>

    <div id="card" class="layer" hidden>
      <div class="panel">
        <div class="eyebrow" id="cardNum">ЭТАП 1/5</div>
        <div class="big" id="cardName">ШРИ-ЛАНКА</div>
        <div class="txt" id="cardTxt"></div>
        <button class="btn primary" id="bGo">▶ ПОЕХАЛИ</button>
      </div>
    </div>

    <div id="stages" class="layer" hidden>
      <div class="panel">
        <div class="big">ЭТАПЫ</div>
        <div class="eyebrow" id="stTest" hidden>ТЕСТ: ОТКРЫТЫ ВСЕ ГОТОВЫЕ ЭТАПЫ</div>
        <div id="stList" class="stlist"></div>
        <button class="btn" id="bStBack">НАЗАД</button>
      </div>
    </div>

    <div id="fin" class="layer" hidden>
      <div class="title fin-title"><span>С ДНЁМ</span><span>РОЖДЕНИЯ,</span><span class="t2">ДИМА!</span></div>
      <div class="menu-bottom">
        <div class="best">Бесконечный заезд открыт</div>
        <div class="btns">
          <button id="bFinEndless" class="btn primary">∞ БЕСКОНЕЧНЫЙ</button>
          <button id="bFinMenu" class="btn">МЕНЮ</button>
        </div>
      </div>
    </div>

    <div id="dlg" hidden>
      <canvas id="por" width="24" height="24"></canvas>
      <div class="dbody"><div id="dname"></div><div id="dtext"></div></div>
      <div class="dnext">▼</div>
    </div>

    <div id="cap" hidden><div id="capMain"></div><div id="capSub"></div></div>

    <button id="bSkip" class="btn small corner" hidden>ПРОПУСТИТЬ ▶▶</button>
    <button id="bPause" class="btn small corner" hidden aria-label="Пауза">II</button>

    <div id="pause" class="layer" hidden>
      <div class="panel">
        <div class="big">ПАУЗА</div>
        <div class="btns" style="flex-direction:column">
          <button class="btn primary" id="bResume">▶ ДАЛЬШЕ</button>
          <button class="btn" id="bSound2">ЗВУК: ВКЛ</button>
          <button class="btn" id="bQuit">В МЕНЮ</button>
        </div>
      </div>
    </div>

    <div id="res" class="layer" hidden>
      <div class="panel">
        <div class="eyebrow" id="resEy"></div>
        <div class="big" id="resTitle"></div>
        <div class="say"><canvas id="resPor" width="24" height="24"></canvas><div id="resSay"></div></div>
        <div class="stats" id="resStats"></div>
        <div class="note" id="resNote"></div>
        <div class="btns" id="resBtns"></div>
      </div>
    </div>

    <div id="loading" class="layer">ЗАГРУЗКА…</div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ============================== utils ============================== */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeIn = (a, b, t) => a + (b - a) * t * t;
const easeInOut = (a, b, t) => a + (b - a) * ((-Math.cos(t * Math.PI) / 2) + 0.5);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = Math.random;
const rnd = (a, b) => a + R() * (b - a);
const pick = a => a[(R() * a.length) | 0];
function hex2rgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function mixHex(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; }
function mk(w, h, fn) {
  const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  if (fn) fn(g, (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.round(ww), Math.round(hh)); });
  return c;
}
function norm(rows, w) { return rows.map(r => (r + '.'.repeat(w)).slice(0, w)); }
function pmap(rows, pal, w) {
  w = w || Math.max(...rows.map(r => r.length)); rows = norm(rows, w);
  return mk(w, rows.length, (g, r) => { rows.forEach((row, y) => { for (let x = 0; x < w; x++) { const c = pal[row[x]]; if (c) r(x, y, 1, 1, c); } }); });
}
function ellipse(r, cx, cy, rx, ry, col, topOnly) {
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
    if (topOnly && y > cy) break;
    const dy = (y + 0.5 - cy) / ry; if (Math.abs(dy) > 1) continue;
    const dx = Math.sqrt(1 - dy * dy) * rx; const x0 = Math.round(cx - dx), x1 = Math.round(cx + dx);
    if (x1 > x0) r(x0, y, x1 - x0, 1, col);
  }
}
function line(r, x0, y0, x1, y1, col, th) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1); th = th || 1;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy, n = 0;
  for (;;) { r(x0, y0, th, th, col); if ((x0 === x1 && y0 === y1) || n++ > 2000) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function ring(r, cx, cy, rad, col) {
  let x = rad, y = 0, err = 1 - rad;
  while (x >= y) {
    [[x, y], [y, x], [-y, x], [-x, y], [-x, -y], [-y, -x], [y, -x], [x, -y]].forEach(([a, b]) => r(cx + a, cy + b, 1, 1, col));
    y++; if (err < 0) err += 2 * y + 1; else { x--; err += 2 * (y - x) + 1; }
  }
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function gradCanvas(w, h, stops) {
  const c = mk(w, h), g = c.getContext('2d'), img = g.createImageData(c.width, c.height), d = img.data;
  const cols = stops.map(s => hex2rgb(s[1]));
  for (let y = 0; y < c.height; y++) {
    const t = c.height > 1 ? y / (c.height - 1) : 0;
    let i = 0; while (i < stops.length - 2 && t > stops[i + 1][0]) i++;
    const t0 = stops[i][0], t1 = stops[i + 1][0]; const f = clamp((t - t0) / ((t1 - t0) || 1), 0, 1);
    const A = cols[i], B = cols[i + 1];
    for (let x = 0; x < c.width; x++) {
      const q = f * 4, base = Math.floor(q), fr = q - base, th = (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
      const lv = Math.min(4, base + (fr > th ? 1 : 0)) / 4, o = (y * c.width + x) * 4;
      d[o] = A[0] + (B[0] - A[0]) * lv; d[o + 1] = A[1] + (B[1] - A[1]) * lv; d[o + 2] = A[2] + (B[2] - A[2]) * lv; d[o + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0); return c;
}
const store = {
  get() { try { return JSON.parse(localStorage.getItem('krutiDima') || '{}'); } catch (e) { return {}; } },
  set(o) { try { localStorage.setItem('krutiDima', JSON.stringify(o)); } catch (e) { } }
};

/* ============================== audio ============================== */
const AU = { c: null, on: true, timer: null, song: null, step: 0, next: 0 };
function auInit() {
  if (AU.c) return;
  try { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; AU.c = new C(); } catch (e) { return; }
  const c = AU.c;
  AU.master = c.createGain(); AU.master.gain.value = AU.on ? 0.8 : 0; AU.master.connect(c.destination);
  AU.mg = c.createGain(); AU.mg.gain.value = 0.3; AU.mg.connect(AU.master);
  AU.sg = c.createGain(); AU.sg.gain.value = 0.6; AU.sg.connect(AU.master);
  const len = c.sampleRate; AU.nb = c.createBuffer(1, len, c.sampleRate);
  const d = AU.nb.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const n = 32, re = new Float32Array(n), im = new Float32Array(n);
  for (let k = 1; k < n; k++) im[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * 0.25);
  AU.pulse = c.createPeriodicWave(re, im);
}
function auResume() { auInit(); if (AU.c && AU.c.state === 'suspended') AU.c.resume(); }
function setSound(on) {
  AU.on = on; if (AU.master) AU.master.gain.value = on ? 0.8 : 0;
  ['#bSound', '#bSound2'].forEach(s => $(s).textContent = 'ЗВУК: ' + (on ? 'ВКЛ' : 'ВЫКЛ'));
  SAVE.sound = on; store.set(SAVE);
}
const NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
const nfCache = {};
function nf(n) { if (nfCache[n]) return nfCache[n]; const m = n.match(/^([A-G]#?)(\d)$/); const midi = 12 * (+m[2] + 1) + NOTE[m[1]]; return (nfCache[n] = 440 * Math.pow(2, (midi - 69) / 12)); }
function tone(type, f, t, dur, vol, dest, slide) {
  const c = AU.c, o = c.createOscillator(), g = c.createGain();
  if (type === 'pulse') o.setPeriodicWave(AU.pulse); else o.type = type;
  o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.03);
}
function noise(t, dur, vol, dest, hp, lp) {
  const c = AU.c, s = c.createBufferSource(); s.buffer = AU.nb; const g = c.createGain(); let node = s;
  if (hp) { const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; node.connect(f); node = f; }
  if (lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; node.connect(f); node = f; }
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  node.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);

function mountainsTo(r, w, baseY, amp, col, snow, f1, f2, seed) {

    const h = amp * (0.55 + 0.35 * tri(x / w * f1 + seed) + 0.15 * tri(x / w * f2 + seed * 2));
    r(x, baseY - h, 1, h + 2, col);

}

  if (!st) { endScene(); return; }
  if (st.say) { S.mode = 'say'; showDlg(st.who, st.say); }
  else if (st.cap) { showCap(st.cap, st.sub, st.lang, st.anchor && S.obj.anchor ? S.obj.anchor(st.anchor) : null); S.mode = 'auto'; S.wait = st.t || 1.4; }
  else if (st.hideCap) { hideCap(); nextStep(); }
  else if (st.do) { if (S.obj[st.do]) S.obj[st.do](); nextStep(); }
  else if (st.wait != null) { S.mode = 'auto'; S.wait = st.wait; }
}
function endScene() { const S = G.scene; if (!S) return; G.scene = null; hideDlg(); hideCap(); $('#bSkip').hidden = true; S.onDone(); }
function advanceScene() {
  const S = G.scene; if (!S || S.mode !== 'say') return;
  if (S.typing) { S.shown = S.full.length; S.typing = false; dtext.textContent = S.full; }
  else { sfx('select'); nextStep(); }
}
function updateScene(dt) {
  const S = G.scene; if (!S) return; S.obj.update(dt);
  if (S.mode === 'auto') { S.wait -= dt; if (S.wait <= 0) nextStep(); }
  else if (S.mode === 'say' && S.typing) {
    const before = Math.floor(S.shown); S.shown += dt * 38; const now = Math.min(S.full.length, Math.floor(S.shown));
    if (now !== before) { dtext.textContent = S.full.slice(0, now); if (now % 2 === 0 && S.full[now - 1] !== ' ') sfx('blip'); }
    if (now >= S.full.length) S.typing = false;
  }
}

const INTRO_STEPS = [
  { wait: 0.8 },
  { who: 'jenya', say: 'Дима! Подъём! Ты помнишь, какое сегодня число?' },
  { who: 'dima', say: 'Эм... Число, когда мы едем дальше?' },
  { who: 'jenya', say: 'Почти. Через пять стран тебя ждёт сюрприз: Шри-Ланка, Индия, Казахстан, Китай и Кыргызстан.' },
  { who: 'jenya', say: 'Пьёшь колу — едешь. Кола кончилась — стоишь.' },
  { who: 'jenya', say: 'И ни во что не влетай. Три аварии — и сюрприз отменяется.' },
  { who: 'dima', say: 'Понял. Крутить педали и не врезаться.' },
  { who: 'jenya', say: 'Погнали!' }
];
const LK_END_STEPS = [
  { wait: 2.6 },
  { cap: 'සුබ උපන්දිනයක් වේවා!', sub: '«С днём рождения!» по-сингальски', lang: 'si', t: 1.6 },
  { who: 'dima', say: 'Это что, мне?! Целый поезд?' },
  { who: 'jenya', say: 'Тебе! Это «с днём рождения» по-сингальски. Дальше будет только больше.' },
  { who: 'dima', say: 'Я из всего понял только «вэва».' },
  { hideCap: true }
];

/* ============================== screens ============================== */
// TEST_STAGES = true: every built stage can be picked from the menu. Set to false for Dima's version:
// then only stages he has already passed are listed as playable.
const TEST_STAGES = false;
const LAYERS = ['#menu', '#card', '#pause', '#res', '#loading', '#stages', '#fin'];
function hideAll() { LAYERS.forEach(s => $(s).hidden = true); hideDlg(); hideCap(); $('#bSkip').hidden = true; $('#bPause').hidden = true; }
function goMenu() {
  hideAll(); G.state = 'menu'; G.paused = false; G.race = null;
  G.demo = newRace('demo', anyCountry()); G.demo.speed = 4500;
  const nextId = STORY[SAVE.stage || 0], cont = $('#bCont'), st = $('#bStory');
  if (SAVE.stage > 0 && ready(nextId)) { cont.hidden = false; cont.textContent = '▶ ПРОДОЛЖИТЬ: ' + stageName(nextId); st.textContent = '↺ СЮЖЕТ'; st.className = 'btn'; }
  else { cont.hidden = true; st.textContent = '▶ СЮЖЕТ'; st.className = 'btn primary'; }
  $('#bStages').hidden = !(TEST_STAGES || SAVE.stage > 0);
  $('#bEndless').hidden = !(TEST_STAGES || SAVE.stage >= 5);
  $('#menu').hidden = false;
  const best = $('#best'); best.hidden = !SAVE.best; best.textContent = 'РЕКОРД: ' + Math.floor(SAVE.best);
  if (AU.c) musicStart('calm');
}
function openStages() {
  hideAll(); G.state = 'stages'; $('#stTest').hidden = !TEST_STAGES;
  if (!G.demo) { G.demo = newRace('demo', anyCountry()); G.demo.speed = 4500; }
  const list = $('#stList'); list.innerHTML = '';
  const mkB = (label, cls, fn, dis) => { const b = document.createElement('button'); b.className = 'btn small ' + cls; b.textContent = label; b.disabled = !!dis; if (!dis) b.addEventListener('click', e => { e.stopPropagation(); auResume(); sfx('select'); fn(); }); return b; };
  const row = (name, sub, buttons) => {
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = name;
    if (sub) { const sm = document.createElement('small'); sm.textContent = sub; nm.appendChild(sm); }
    const acts = document.createElement('div'); acts.className = 'acts'; buttons.forEach(b => acts.appendChild(b));
    list.appendChild(nm); list.appendChild(acts);
  };
  if (TEST_STAGES) row('0. ВСТУПЛЕНИЕ', 'катсцена с Женей', [mkB('СЦЕНА', '', () => playScene(sceneIntro(), INTRO_STEPS, openStages, 'calm'))]);
  let firstBtn = null;
  STORY.forEach((id, i) => {
    const built = ready(id), passed = i < (SAVE.stage || 0), open = built && (TEST_STAGES || passed);
    const sub = !built ? 'скоро' : passed ? 'пройден' : open ? 'не пройден' : 'закрыт';
    const btns = [];
    if (TEST_STAGES && built) btns.push(mkB('СЦЕНА', '', () => playScene(COUNTRIES[id].endScene(), COUNTRIES[id].endSteps(), openStages, 'calm')));
    const play = mkB('ЕХАТЬ', open ? 'primary' : '', () => showCard(COUNTRIES[id], 'story'), !open);
    btns.push(play); if (open && !firstBtn) firstBtn = play;
    row((i + 1) + '. ' + stageName(id).toUpperCase(), sub, btns);
  });
  if (TEST_STAGES) row('6. ФИНАЛ', 'поздравление от Жени', [mkB('СЦЕНА', '', () => { const sc = sceneFinale(); playScene(sc, FINALE_STEPS, () => showFin(sc), 'fin'); })]);
  $('#stages').hidden = false;
  setTimeout(() => (firstBtn || $('#bStBack')).focus({ preventScroll: true }), 50);
}
function showCard(C, mode) {
  hideAll(); G.state = 'card';
  $('#cardNum').textContent = mode === 'story' ? 'ЭТАП ' + C.num + '/5' : 'БЕСКОНЕЧНЫЙ ЗАЕЗД';
  $('#cardName').textContent = mode === 'story' ? C.name : C.name;
  $('#cardTxt').textContent = mode === 'story' ? C.hint : 'Скорость растёт, машин всё больше. Сколько протянешь?';
  $('#card').hidden = false; G.cardMode = mode; G.cardC = C;
  setTimeout(() => $('#bGo').focus({ preventScroll: true }), 50);
}
function startRace() {
  hideAll(); G.state = 'race'; G.paused = false;
  G.race = newRace(G.cardMode, G.cardC); G.demo = null;
  $('#bPause').hidden = false; musicStart(G.cardC.music);
}
function setPause(p) {
  if (G.state !== 'race') return; G.paused = p; $('#pause').hidden = !p; $('#bPause').hidden = p;
  ptrs.clear(); G.input.l = G.input.r = false;
  if (p) setTimeout(() => $('#bResume').focus({ preventScroll: true }), 30);
}
function onStageDone(r) {
  $('#bPause').hidden = true;
  if (r.C.id === 'kg') { SAVE.stage = 5; store.set(SAVE); playScene(r.C.endScene(), r.C.endSteps(), playFinale, 'calm'); return; }
  playScene(r.C.endScene(), r.C.endSteps(), () => showResults(r, true), 'calm');
}
function playFinale() {
  const sc = sceneFinale();
  playScene(sc, FINALE_STEPS, () => showFin(sc), 'fin');
}
function showFin(sc) {
  hideAll(); G.state = 'fin'; G.finScene = sc; sc.fw();
  SAVE.stage = 5; store.set(SAVE);
  $('#fin').hidden = false; setTimeout(() => $('#bFinEndless').focus({ preventScroll: true }), 50);
}
function onRaceOver(r) {
  G.state = 'over'; $('#bPause').hidden = true; musicStop(); sfx('over');
  let record = false;
  if (r.mode === 'endless' && r.score > SAVE.best) { SAVE.best = r.score; store.set(SAVE); record = true; }
  showResults(r, false, record);
}
function fmtTime(s) { const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }
function showResults(r, win, record) {
  hideAll(); G.state = 'results';
  const eb = $('#resEy'), tt = $('#resTitle'), say = $('#resSay'), st = $('#resStats'), note = $('#resNote'), btns = $('#resBtns');
  paintPortrait($('#resPor'), 'jenya');
  if (win) {
    const idx = STORY.indexOf(r.C.id); SAVE.stage = Math.max(SAVE.stage || 0, idx + 1); store.set(SAVE);
    eb.textContent = 'ЭТАП ' + r.C.num + '/5 ПРОЙДЕН'; tt.textContent = r.C.name;
    say.textContent = r.crashes === 0 ? r.C.win[1] : r.C.win[0];
    const rest = STORY.slice(idx + 1).filter(id => !ready(id)).map(stageName);
    note.textContent = ready(r.C.next) || !rest.length ? '' : rest.join(', ').replace(/, ([^,]*)$/, ' и $1') + ' ещё в работе. Пока можно погонять бесконечный заезд.';
  } else {
    eb.textContent = record ? 'НОВЫЙ РЕКОРД!' : 'ЗАЕЗД ОКОНЧЕН';
    tt.textContent = r.dying === 'fuel' ? 'КОЛА КОНЧИЛАСЬ' : 'ТРИ АВАРИИ';
    say.textContent = r.dying === 'fuel' ? pick(['Колу надо пить, а не любоваться!', 'Без колы далеко не уедешь. Ещё разок?']) : pick(r.C.crash);
    note.textContent = r.mode === 'endless' ? 'Рекорд: ' + Math.floor(SAVE.best) : '';
  }
  const rows = [['Очки', Math.floor(r.score)], ['Кола', r.colas], ['Впритирку', r.nears], ['Аварии', r.crashes], [r.mode === 'endless' ? 'Проехал' : 'Время', r.mode === 'endless' ? (r.dist / 1000).toFixed(1) + ' км' : fmtTime(r.time)]];
  st.innerHTML = rows.map(([k, v]) => '<div>' + k + '</div><div class="v">' + v + '</div>').join('');
  btns.innerHTML = '';
  const mkBtn = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = label; b.addEventListener('click', e => { e.stopPropagation(); auResume(); sfx('select'); fn(); }); btns.appendChild(b); return b; };
  let first;
  if (win) {
    const nx = r.C.next;
    if (ready(nx)) first = mkBtn('▶ ДАЛЬШЕ: ' + stageName(nx), 'primary', () => showCard(COUNTRIES[nx], 'story'));
    else first = mkBtn('∞ БЕСКОНЕЧНЫЙ', 'primary', () => showCard(anyCountry(), 'endless'));
    mkBtn('↺ ЕЩЁ РАЗ', '', () => showCard(r.C, 'story'));
  }
  else first = mkBtn('↺ ЕЩЁ РАЗ', 'primary', () => showCard(r.C, r.mode));
  mkBtn('МЕНЮ', '', goMenu);
  $('#res').hidden = false; setTimeout(() => first.focus({ preventScroll: true }), 50);
}

/* ============================== input ============================== */
const KEYL = new Set(['ArrowLeft', 'KeyA']), KEYR = new Set(['ArrowRight', 'KeyD']);
window.addEventListener('keydown', e => {
  if (KEYL.has(e.code)) { G.input.l = true; e.preventDefault(); }
  if (KEYR.has(e.code)) { G.input.r = true; e.preventDefault(); }
  if (e.code === 'Space' || e.code === 'Enter') {
    if (G.state === 'scene') { e.preventDefault(); advanceScene(); }
  }
  if ((e.code === 'Escape' || e.code === 'KeyP') && G.state === 'race') setPause(!G.paused);
});
window.addEventListener('keyup', e => { if (KEYL.has(e.code)) G.input.l = false; if (KEYR.has(e.code)) G.input.r = false; });
function syncPtr() { let l = false, rr = false; for (const v of ptrs.values()) { if (v < 0) l = true; else rr = true; } G.touchL = l; G.touchR = rr; G.input.l = l || G.keyL; G.input.r = rr || G.keyR; }
stageEl.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  auResume();
  if (G.state === 'scene') { if (!e.target.closest('#bSkip')) advanceScene(); return; }
  if (G.state === 'race' && !G.paused) {
    const rect = stageEl.getBoundingClientRect();
    ptrs.set(e.pointerId, (e.clientX - rect.left) < rect.width / 2 ? -1 : 1);
    try { stageEl.setPointerCapture(e.pointerId); } catch (_) { }
    let l = false, rr = false; for (const v of ptrs.values()) { if (v < 0) l = true; else rr = true; }
    G.input.l = l; G.input.r = rr; e.preventDefault();
  }
});
const ptrEnd = e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
  let l = false, rr = false; for (const v of ptrs.values()) { if (v < 0) l = true; else rr = true; }
  G.input.l = l; G.input.r = rr;
};
stageEl.addEventListener('pointerup', ptrEnd); stageEl.addEventListener('pointercancel', ptrEnd);
stageEl.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'race' && !G.paused) setPause(true); });

const onBtn = (sel, fn) => $(sel).addEventListener('click', e => { e.stopPropagation(); auResume(); sfx('select'); fn(); });
onBtn('#bStory', () => playScene(sceneIntro(), INTRO_STEPS, () => showCard(COUNTRIES.lk, 'story'), 'calm'));
onBtn('#bEndless', () => showCard(anyCountry(), 'endless'));
onBtn('#bStages', openStages);
onBtn('#bStBack', goMenu);
onBtn('#bFinEndless', () => showCard(anyCountry(), 'endless'));
onBtn('#bFinMenu', goMenu);
onBtn('#bCont', () => showCard(COUNTRIES[STORY[SAVE.stage]], 'story'));
onBtn('#bGo', startRace);
onBtn('#bSkip', endScene);
onBtn('#bPause', () => setPause(true));
onBtn('#bResume', () => setPause(false));
onBtn('#bQuit', goMenu);
$('#bSound').addEventListener('click', e => { e.stopPropagation(); auResume(); setSound(!AU.on); if (AU.on && G.state === 'menu') musicStart('calm'); });
$('#bSound2').addEventListener('click', e => { e.stopPropagation(); auResume(); setSound(!AU.on); });
// the first gesture anywhere unlocks audio and starts menu music
window.addEventListener('pointerdown', () => { const had = !!AU.c; auResume(); if (!had && AU.c && G.state === 'menu') musicStart('calm'); }, { capture: true });
window.addEventListener('keydown', () => { const had = !!AU.c; auResume(); if (!had && AU.c && G.state === 'menu') musicStart('calm'); }, { capture: true });

/* ============================== loop ============================== */
let last = 0;
function frame(ts) {
  const dt = Math.min(1 / 30, (ts - last) / 1000 || 0); last = ts; G.t += dt;
  ctx.imageSmoothingEnabled = false;
  if (G.state === 'menu' && G.demo) { updateRace(G.demo, dt); renderRace(ctx, G.demo); }
  else if (G.state === 'race' && G.race) { if (!G.paused) updateRace(G.race, dt); renderRace(ctx, G.race); }
  else if ((G.state === 'results' || G.state === 'over' || G.state === 'card' || G.state === 'stages') && (G.race || G.demo)) { renderRace(ctx, G.race || G.demo); ctx.fillStyle = 'rgba(11,13,22,.45)'; ctx.fillRect(0, 0, W, H); }
  else if (G.state === 'card' && !G.race) { ctx.fillStyle = '#0b0d16'; ctx.fillRect(0, 0, W, H); }
  else if (G.state === 'scene' && G.scene) { updateScene(dt); G.scene && G.scene.obj.draw(ctx); }
  else if (G.state === 'fin' && G.finScene) { G.finScene.update(dt); G.finScene.draw(ctx); ctx.fillStyle = 'rgba(11,13,22,.25)'; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}

/* ============================== boot ============================== */
async function boot() {
  resize();
  try { await Promise.race([Promise.all([document.fonts.load('8px "Press Start 2P"', 'ДИМА 0123'), document.fonts.load('24px "Press Start 2P"', '123')]), new Promise(r => setTimeout(r, 2500))]); } catch (e) { }
  buildSprites();
  AU.on = SAVE.sound !== false; setSound(AU.on);
  $('#loading').hidden = true;
  goMenu();
  requestAnimationFrame(frame);
}
boot();
})();
</script>
